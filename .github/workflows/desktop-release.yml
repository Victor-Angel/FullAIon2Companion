name: Publicar app de escritorio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Preparar versión
        shell: pwsh
        run: |
          "APP_VERSION=1.1.${{ github.run_number }}" >> $env:GITHUB_ENV
      - name: Publicar aplicación
        shell: pwsh
        run: |
          dotnet publish desktop/FullAIon2Companion/FullAIon2Companion.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -o desktop/release-build/app
      - name: Crear instalador
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$((Resolve-Path 'desktop/release-build/app').Path)" "/DOutputDir=$((Resolve-Path '.').Path)\desktop\release-build" 'desktop/installer/FullAIon2Companion.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar versión de GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = "desktop/release-build/FullAIon2Companion-$env:APP_VERSION-setup.exe"
          if (-not (Test-Path -LiteralPath $file)) { throw "Instalador ausente: $file" }
          gh release create "v$env:APP_VERSION" $file --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "FullAIon2Companion $env:APP_VERSION" --notes "Compilación automática del commit $env:GITHUB_SHA. Interfaz en español e inglés." --latest
